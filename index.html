<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <link rel="icon" type="image/jpg"  href="https://doctoreto.com/favicon-96x96.png">
    <title> Banner Monitor 🔥🧠🪾🦕</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
    
</head>
<body>
<div class="container">
    <h1>
        ⛏️ Squad 42 🔨🪬
        <small> Banner Monitor </small>
    </h1>
    <div class="subtitle"> چه خوبه آدم همیشه آمار بنرهاشو داشته باشه ! رفقا ، هرچی اینجا تعامل کنید داشبورد بهتری میتونم درست کنم - لیبل کارشناس - قیمت و غیره ... </div>

    <div class="card-grid" id="cardGrid">
        <div class="empty-state">
            <strong>⏳ Loading campaign data...</strong><br>
            <span style="font-size:0.8rem;">Reading excel.xlsx</span>
        </div>
    </div>
    <div class="debug-info" id="debugInfo">Initializing...</div>
</div>

<script>
    (function() {
        const cardGrid = document.getElementById('cardGrid');
        const debugInfo = document.getElementById('debugInfo');

        // Get today's date in Jalali calendar
        function getTodayJalali() {
            try {
                const now = new persianDate();
                return {
                    year: now.year(),
                    month: now.month(),
                    day: now.date()
                };
            } catch(e) {
                console.warn('Failed to get Jalali date:', e);
                return null;
            }
        }

        // Parse Jalali date string to object {year, month, day}
        function parseJalaliDate(value) {
            if (!value) return null;
            
            // If it's a string
            if (typeof value === 'string') {
                let str = String(value).trim();
                const parts = str.split(/[\/\-.]/);
                if (parts.length === 3) {
                    let year = parseInt(parts[0], 10);
                    let month = parseInt(parts[1], 10);
                    let day = parseInt(parts[2], 10);
                    
                    if (!isNaN(year) && !isNaN(month) && !isNaN(day)) {
                        // Check if it's a Jalali date (year between 1300-1500)
                        if (year >= 1300 && year <= 1500 && month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                            return { year, month, day };
                        }
                    }
                }
            }
            return null;
        }

        // Compare two Jalali dates
        function compareJalaliDates(date1, date2) {
            if (!date1 || !date2) return 0;
            if (date1.year !== date2.year) return date1.year - date2.year;
            if (date1.month !== date2.month) return date1.month - date2.month;
            return date1.day - date2.day;
        }

        // Get status based on Jalali dates
        function getStatus(startDate, endDate) {
            const today = getTodayJalali();
            
            if (!today) {
                return { status: 'active', label: 'Active', className: 'status-active' };
            }

            // Parse dates
            const start = parseJalaliDate(startDate);
            const end = parseJalaliDate(endDate);

            // If no valid dates, treat as active
            if (!start && !end) {
                return { status: 'active', label: 'Active', className: 'status-active' };
            }
            
            // Only start date
            if (!end) {
                if (start && compareJalaliDates(start, today) <= 0) {
                    return { status: 'active', label: 'Active', className: 'status-active' };
                } else if (start && compareJalaliDates(start, today) > 0) {
                    return { status: 'soon', label: 'Upcoming', className: 'status-soon' };
                }
                return { status: 'active', label: 'Active', className: 'status-active' };
            }
            
            // Only end date
            if (!start) {
                if (end && compareJalaliDates(end, today) >= 0) {
                    return { status: 'active', label: 'Active', className: 'status-active' };
                } else {
                    return { status: 'expired', label: 'Expired', className: 'status-expired' };
                }
            }

            // Both dates exist
            if (compareJalaliDates(start, today) <= 0 && compareJalaliDates(end, today) >= 0) {
                return { status: 'active', label: 'Active', className: 'status-active' };
            } else if (compareJalaliDates(start, today) > 0) {
                return { status: 'soon', label: 'Upcoming', className: 'status-soon' };
            } else if (compareJalaliDates(end, today) < 0) {
                return { status: 'expired', label: 'Expired', className: 'status-expired' };
            }
            
            return { status: 'active', label: 'Active', className: 'status-active' };
        }

        function renderCards(data) {
            if (!data || data.length === 0) {
                cardGrid.innerHTML = `
                    <div class="empty-state">
                        <strong>📭 No campaigns found</strong><br>
                        <span style="font-size:0.8rem;">Check column names: Campaign Name, Banner, Start Date, End Date</span>
                    </div>
                `;
                return;
            }

            let html = '';
            data.forEach((row) => {
                const name = row['Campaign Name'] || row['campaign name'] || row['Name'] || 'Untitled';
                const banner = row['Banner'] || row['banner'] || '';
                const startRaw = row['Start Date'] || row['start date'] || row['Start'] || null;
                const endRaw = row['End Date'] || row['end date'] || row['End'] || null;

                // Display dates as they are in Excel
                const startStr = startRaw ? String(startRaw).trim() : '—';
                const endStr = endRaw ? String(endRaw).trim() : '—';

                // Get status
                const status = getStatus(startRaw, endRaw);

                // Extract image URL from banner
                let imgSrc = '';
                if (banner) {
                    const match = banner.match(/src=["']([^"']+)["']/i);
                    if (match && match[1]) {
                        imgSrc = match[1];
                    } else if (banner.startsWith('http') || banner.startsWith('data:image')) {
                        imgSrc = banner;
                    }
                }

                html += `
                    <div class="card">
                        <div class="card-image">
                            ${imgSrc ? `<img src="${imgSrc}" alt="${name}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'placeholder-img\\'>🖼️</div>'">` : `<div class="placeholder-img">🖼️</div>`}
                        </div>
                        <div class="card-name" title="${name}">${name}</div>
                        <div class="card-dates">
                            <div class="date-range">
                                <span class="date-badge">📅 ${startStr}</span>
                                <span class="arrow">—</span>
                                <span class="date-badge">📅 ${endStr}</span>
                            </div>
                            <div class="status-text ${status.className}">
                                <span class="status-indicator"></span> ${status.label}
                            </div>
                        </div>
                    </div>
                `;
            });

            cardGrid.innerHTML = html;
        }

        // Load Excel from local file
        function loadExcelFile() {
            debugInfo.textContent = '⏳ Loading excel.xlsx...';
            debugInfo.className = 'debug-info';

            fetch('Campaigns_of_Siavash_edited.xlsx')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`File not found (status: ${response.status}). Make sure excel.xlsx is in the same folder.`);
                    }
                    return response.arrayBuffer();
                })
                .then(arrayBuffer => {
                    try {
                        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

                        if (json.length === 0) {
                            debugInfo.textContent = '⚠️ Excel file is empty';
                            debugInfo.className = 'debug-info error';
                            renderCards([]);
                            return;
                        }

                        // Normalize column names
                        const normalized = json.map(row => {
                            const newRow = {};
                            Object.keys(row).forEach(key => {
                                const lowerKey = key.trim().toLowerCase();
                                if (lowerKey.includes('banner')) newRow['Banner'] = row[key];
                                else if (lowerKey.includes('start') && lowerKey.includes('date')) newRow['Start Date'] = row[key];
                                else if (lowerKey.includes('end') && lowerKey.includes('date')) newRow['End Date'] = row[key];
                                else if (lowerKey.includes('campaign') || lowerKey.includes('name')) newRow['Campaign Name'] = row[key];
                                else newRow[key] = row[key];
                            });
                            if (!newRow['Banner']) newRow['Banner'] = row['Banner'] || row['banner'] || '';
                            if (!newRow['Start Date']) newRow['Start Date'] = row['Start Date'] || row['start date'] || null;
                            if (!newRow['End Date']) newRow['End Date'] = row['End Date'] || row['end date'] || null;
                            if (!newRow['Campaign Name']) newRow['Campaign Name'] = row['Campaign Name'] || row['campaign name'] || row['Name'] || 'Unnamed';
                            return newRow;
                        });

                        const today = getTodayJalali();
                        debugInfo.textContent = `✅ Loaded ${normalized.length} campaigns | Today: ${today.year}/${today.month}/${today.day}`;
                        debugInfo.className = 'debug-info success';
                        renderCards(normalized);
                    } catch (err) {
                        console.error('Error parsing Excel:', err);
                        debugInfo.textContent = `❌ Error parsing Excel: ${err.message}`;
                        debugInfo.className = 'debug-info error';
                        cardGrid.innerHTML = `
                            <div class="error-state">
                                <strong>❌ Could not parse Excel file</strong><br>
                                <span style="font-size:0.8rem;">${err.message}</span>
                            </div>
                        `;
                    }
                })
                .catch(err => {
                    console.error('Error loading file:', err);
                    debugInfo.textContent = `❌ ${err.message}`;
                    debugInfo.className = 'debug-info error';
                    cardGrid.innerHTML = `
                        <div class="error-state">
                            <strong>❌ Could not load excel.xlsx</strong><br>
                            <span style="font-size:0.8rem;">Make sure the file is in the same directory as this HTML page.</span>
                            <br><br>
                            <span style="font-size:0.7rem; color:#666;">Error: ${err.message}</span>
                        </div>
                    `;
                });
        }

        loadExcelFile();
    })();
</script>
</body>
</html>
